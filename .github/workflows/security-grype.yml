name: Security Image & Dependency Scan (Grype)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  grype-image-scan:
    name: Build & Scan Final Nginx Image with Grype
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build final production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: pdf-extractor-frontend:ci-${{ github.sha }}

      - name: Run Grype scan (SARIF output)
        id: grype-sarif
        uses: anchore/scan-action@v4
        with:
          image: pdf-extractor-frontend:ci-${{ github.sha }}
          acs-report-enable: false
          fail-build: false
          output-format: sarif
          severity-cutoff: high
          only-fixed: true

      - name: Run Grype scan (JSON output & severity gate)
        id: grype-json
        uses: anchore/scan-action@v4
        with:
          image: pdf-extractor-frontend:ci-${{ github.sha }}
          acs-report-enable: false
          fail-build: true
          output-format: json
          severity-cutoff: high
          only-fixed: true

      - name: Upload Grype SARIF & JSON reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-security-reports-${{ github.run_number }}
          retention-days: 30
          path: |
            ${{ steps.grype-sarif.outputs.sarif }}
            ${{ steps.grype-json.outputs.json }}

      - name: Upload SARIF report to GitHub Security tab
        if: always() && steps.grype-sarif.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype-sarif.outputs.sarif }}
          category: grype-container-scan
