services:
  # ------------------------------------------------------------------
  # Microservicio Front-End (Nginx sirviendo UI estatica)
  # Discovery - Consul Catalog + Traefik centralizados en infraestructura (orchestrator #56)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-frontend
    image: pdf-frontend:0.2.0
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 10s
    environment:
      - API_BASE_PATH=
      - MAX_UPLOAD_MB=10
      - REQUEST_TIMEOUT_MS=45000
      - LOG_LEVEL=info
      - ACCESS_LOG=on
    expose:
      - "80"
    networks:
      - shared_network

# ------------------------------------------------------------------
# Red externa compartida con la infraestructura central y backend
# Configurable mediante DOCKER_NETWORK_NAME (por defecto: pdf-extractortext_pdf-network)
# ------------------------------------------------------------------
networks:
  shared_network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-pdf-extractortext_pdf-network}
