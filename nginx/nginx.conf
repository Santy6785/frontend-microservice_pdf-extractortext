worker_processes auto;
pid /tmp/nginx.pid;
worker_shutdown_timeout 5s;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Formato de logs estructurado en JSON a stdout (esquema FastAPI, sin datos sensibles)
    log_format json_fastapi escape=json
      '"{\"timestamp\":\"$time_iso8601\",'
      '\"level\":\"INFO\",'
      '\"service\":\"frontend\",'
      '\"message\":\"request\",'
      '\"request_id\":\"$request_id\",'
      '\"method\":\"$request_method\",'
      '\"path\":\"$uri\",'
      '\"status\":$status,'
      '\"duration_s\":$request_time}';

    # Configuracion de error_log (sobrescrita por 40-generate-config.sh en runtime)
    include /etc/nginx/log_error.conf;

    # Configuracion de access_log (sobrescrita por 40-generate-config.sh en runtime)
    include /etc/nginx/log_access.conf;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compresion gzip para estaticos
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Cabeceras de seguridad y Politica de Seguridad de Contenidos (CSP)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

        # Health check estatico para Docker y Traefik
        location = /health {
            access_log off;
            default_type application/json;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
            return 200 '{"status":"ok","service":"frontend"}';
        }

        # Bloqueo explicito de rutas internas/operativas en puerto publico 80
        location ~ ^/(metrics|trace|nginx_status|status|pause|resume|shutdown)$ {
            access_log off;
            return 404;
        }

        # index.html y config.js sin cache para garantizar runtime config actualizada
        location = /index.html {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }

        location = /config.js {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }

        # Archivos estaticos generales (JS, CSS, fuentes, imagenes) con cache de 1h
        location / {
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
            add_header Cache-Control "public, max-age=3600, no-transform" always;
            try_files $uri $uri/ =404;
        }
    }

    # ------------------------------------------------------------------
    # Modulo de diagnostico/metricas internas (stub_status) - solo red Docker
    # ------------------------------------------------------------------
    # - No publicado en el host (sin ports:) ni enrutado por Traefik (solo puerto 80)
    # - Accesible unicamente desde contenedores de la red interna Docker
    server {
        listen 8081;
        access_log off;

        location = /metrics {
            stub_status;
        }

        location / {
            return 404;
        }
    }
}
